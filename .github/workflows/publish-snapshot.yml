name: Publish React Lab snapshot

on:
  push:
    paths:
      - '.github/workflows/publish-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish reviewed project files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_COMMIT: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, urllib.request, zipfile

          repo = os.environ['GH_REPO']
          if repo != 'FEMADOX/react-lab' or os.environ['GH_BRANCH'] != 'main':
              raise SystemExit('Unexpected publication destination')
          root = 'https://api.github.com/repos/' + repo
          def api(method, path, data=None):
              body = None if data is None else json.dumps(data).encode('utf-8')
              request = urllib.request.Request(root + path, data=body, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          parent = os.environ['GH_COMMIT']
          current = api('GET', '/git/ref/heads/main')['object']['sha']
          if current != parent:
              raise SystemExit('Branch changed after workflow started')
          source = api('GET', '/contents/react-lab-source.zip?ref=' + parent)
          data = base64.b64decode(source['content'])
          if hashlib.sha256(data).hexdigest() != '3d6fdb3357d181a97dceb37dc482b76fd10c0cf9ad181c8ad9214a8f17c846a9':
              raise SystemExit('Publication archive checksum mismatch')
          entries = []
          with zipfile.ZipFile(io.BytesIO(data)) as bundle:
              if len(bundle.infolist()) != 110:
                  raise SystemExit('Unexpected publication file count')
              for member in bundle.infolist():
                  path = member.filename
                  if member.is_dir() or path.startswith('/') or '..' in path.split('/'):
                      raise SystemExit('Invalid archive path')
                  payload = bundle.read(member)
                  item = {'path': path, 'mode': '100644', 'type': 'blob'}
                  try:
                      item['content'] = payload.decode('utf-8')
                  except UnicodeDecodeError:
                      item['sha'] = api('POST', '/git/blobs',
                          {'content': base64.b64encode(payload).decode('ascii'), 'encoding': 'base64'})['sha']
                  entries.append(item)

          workflow_path = '.github/workflows/publish-snapshot.yml'
          workflow_sha = api('GET', '/contents/' + workflow_path + '?ref=' + parent)['sha']
          entries.append({'path': workflow_path, 'mode': '100644', 'type': 'blob', 'sha': workflow_sha})
          tree = api('POST', '/git/trees', {'tree': entries})['sha']
          commit = api('POST', '/git/commits',
              {'message': 'Publish React and TypeScript laboratory projects',
               'tree': tree, 'parents': [parent]})['sha']
          api('PATCH', '/git/refs/heads/main', {'sha': commit, 'force': False})
          print('Published', len(entries), 'reviewed files at commit', commit)
          PY
